---
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: # supply bucket to store Terraform state

vars:
  enable_slurm_auth: true
  deployment_name: a3high-cluster
  project_id: your-gcp-project-id
  region: us-west1
  zone: us-west1-b
 
  # Kernel credentials supplied by Google Cloud
  tcpx_kernel_login: "your-tcpx-login"
  tcpx_kernel_password: "your-tcpx-password"
  keyserver_ubuntu_key: "your-keyserver-key"
 
  # Capacity provisioning (Reservation, Spot, or DWS Flex)
  a3_reservation_name: "your-a3-reservation-name"
  a3_static_cluster_size: 4
 
  slurm_cluster_name: "a3h-slurm"
  a3_partition_name: "a3high"
